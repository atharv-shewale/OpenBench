# Render.com deployment configuration
# https://render.com/docs/render-yaml-spec
#
# Connects: GitHub repo → Render → auto-deploy on push to main.
# First deploy: set environment variables in Render dashboard.

services:
  # ── Web Service (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: openbench-api
    runtime: python
    region: singapore          # closest to India
    plan: free                 # upgrade to starter for production
    rootDir: backend
    buildCommand: |
      set -e
      python -m pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
      cd ../frontend && npm ci && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: openbench-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: https://openbench-api.onrender.com

  # ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: openbench-db
    databaseName: openbench
    user: openbench
    region: singapore
    plan: free

