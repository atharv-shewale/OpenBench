version: "3.9"

services:
  # ── PostgreSQL (production-like local dev) ────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbench
      POSTGRES_PASSWORD: openbench_dev
      POSTGRES_DB: openbench
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbench"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + uvicorn) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://openbench:openbench_dev@db:5432/openbench
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      AUTO_SEED: ${AUTO_SEED:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      # Hot-reload in dev (remove in prod)
      - ./backend:/app
      - ./frontend/dist:/app/static
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload

volumes:
  pgdata:

